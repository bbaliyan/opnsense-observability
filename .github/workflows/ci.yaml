name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: v4.2.4

      - name: Add prometheus-community repo
        run: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest

      - name: Run helm-unittest
        run: helm unittest .

      - uses: helm/chart-testing-action@v2

      - name: Run ct lint
        run: ct lint --config ct.yaml

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Install Prometheus Operator CRDs
        run: |
          kubectl apply --server-side -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_servicemonitors.yaml
          kubectl apply --server-side -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_probes.yaml
          kubectl apply --server-side -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_prometheusrules.yaml

      - name: Apply CI fixture secret
        run: kubectl apply -f ci/core-secret.yaml

      - name: helm dependency update
        run: helm dependency update .

      - name: Install chart
        run: |
          helm install opnsense-observability-ci . \
            -f ci/core-values.yaml \
            --wait --timeout 5m

      - name: Verify pods are ready
        run: kubectl get pods -o wide && kubectl wait --for=condition=Ready pod --all --timeout=60s
