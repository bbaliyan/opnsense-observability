# -- Escape hatch: arbitrary extra Kubernetes manifests to render alongside
# this chart, e.g. a headless Service + Endpoints so Prometheus can scrape
# os-node_exporter running on the OPNsense firewall itself (an out-of-cluster
# target this chart has no built-in way to reach). Each entry is a full
# manifest (rendered with Helm's tpl, so .Release/.Values are usable inside).
extraObjects: []

# -- opnsense-exporter: polls the OPNsense REST API for system/service/
# firmware/gateway status. See README prerequisites for the read-only API
# user/key this needs.
opnsenseExporter:
  enabled: true
  image:
    repository: ghcr.io/athennamind/opnsense-exporter
    tag: "0.0.16"
    pullPolicy: IfNotPresent
  opnsense:
    protocol: https
    address: ""                 # e.g. 192.168.1.1
    instanceLabel: "opnsense"
    insecureSkipVerify: false
    apiKeySecretRef: {name: "", key: "api-key"}
    apiSecretSecretRef: {name: "", key: "api-secret"}
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 64Mi}

# -- blackbox-exporter: ICMP probe of the OPNsense WAN gateway from inside the
# cluster. Internet reachability is measured by the firewall's own gateway
# monitoring and read through opnsense-exporter.
blackboxExporter:
  enabled: false
  scrapeInterval: 10s
  wanGatewayAddress: ""           # OPNsense WAN gateway IP, user-supplied
  probeSelectorLabels: {}         # must match the cluster Prometheus's probeSelector

# -- Passthrough values for the prometheus-blackbox-exporter subchart
# (aliased "blackbox-exporter" in Chart.yaml). ICMP needs NET_RAW, which
# the subchart ships commented out by default.
blackbox-exporter:
  config:
    modules:
      icmp:
        prober: icmp
        timeout: 5s
        icmp:
          preferred_ip_protocol: "ip4"
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    readOnlyRootFilesystem: true
    runAsNonRoot: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
      add: ["NET_RAW"]

# -- Grafana dashboard ConfigMaps picked up by the dashboard sidecar.
dashboards:
  enabled: true
  folder: "OPNsense"

# -- PrometheusRule alerting on firmware, gateway, probe and pipeline health.
alerts:
  enabled: true
  firmwareUpdateAvailable: {enabled: true, severity: warning}
  gatewayDown: {enabled: true, severity: critical}
  highPacketLoss: {enabled: true, thresholdPercent: 5, severity: warning}
  highLatency: {enabled: true, thresholdMs: 150, severity: warning}
  probeFailed: {enabled: true, severity: critical}
  akvoradoPipelineLag: {enabled: true, severity: warning}

# -- ServiceMonitor objects for this chart's own workloads.
serviceMonitor:
  enabled: true
  namespace: ""                  # defaults to release namespace
  labels: {}                     # must match the cluster Prometheus's serviceMonitorSelector
  interval: 30s

# -- Akvorado: NetFlow/IPFIX traffic-analytics pipeline (inlet, outlet,
# orchestrator, console) backed by Redpanda and a vendored single-node
# ClickHouse. Off by default — enabling it adds Redpanda + ClickHouse pods.
akvorado:
  enabled: false
  image:
    repository: quay.io/akvorado/akvorado
    tag: "2026.8.1"
    pullPolicy: IfNotPresent
  netflow:
    listenPort: 2055
    serviceType: LoadBalancer   # so OPNsense on the LAN side can reach it
  kafka:
    # Empty = compute from the bundled Redpanda's internal Kafka listener
    # ({{ .Release.Name }}:9093 — the redpanda chart's own fullname has no
    # "-redpanda" suffix). Set to point at an external broker.
    brokers: []
  clickhouse:
    image:
      repository: clickhouse/clickhouse-server
      tag: "26.3.25.2"
    persistence:
      size: 20Gi
      storageClassName: ""
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {memory: 2Gi}
  geoip:
    enabled: true               # auto-download DB-IP Lite .mmdb files
    source: dbip-lite            # dbip-lite (default, no account) | maxmind
    updateSchedule: "0 6 1 * *"  # monthly, DB-IP republishes monthly
    persistence:
      size: 256Mi
      storageClassName: ""
  console:
    ingress:
      enabled: false
      className: ""
      host: ""
      tls: []
      annotations: {}
  # Shared across orchestrator/inlet/outlet/console. The outlet needs the
  # most headroom - it loads the GeoIP .mmdb databases (~20MB) into memory.
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 1Gi}

# -- evebox: Suricata IDS alert triage. Receives EVE JSON shipped from the
# firewall's native syslog output and stores it in SQLite.
evebox:
  enabled: false
  image:
    repository: jasonish/evebox
    tag: "0.28.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5636
  syslog:
    image:
      repository: timberio/vector
      tag: "0.44.0-alpine"
      pullPolicy: IfNotPresent
    service:
      # The web UI runs with authentication disabled, so it stays on the
      # ClusterIP Service above; only this one should be published on the LAN.
      type: ClusterIP
      port: 5140
    maxMessageBytes: 1048576
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {memory: 128Mi}
  ingress:
    enabled: false
    className: ""
    host: ""
    tls: []
    annotations: {}
  persistence:
    size: 5Gi
    storageClassName: ""
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

# -- Passthrough values for the redpanda subchart. Single-node by default —
# this chart targets one homelab firewall's flow volume, not a production
# streaming cluster.
redpanda:
  statefulset:
    replicas: 1
  storage:
    persistentVolume:
      size: 10Gi
  console:
    enabled: false
  # Akvorado dials Kafka in plaintext (no kafka.tls block in its config) and
  # this chart doesn't bundle cert-manager, which the redpanda chart's
  # default TLS listener requires.
  tls:
    enabled: false
