# Core install: opnsense-exporter, blackbox-exporter, the health and
# connectivity dashboards, and the core alert rules. No Akvorado, no EveBox.
opnsenseExporter:
  opnsense:
    protocol: https
    address: "192.168.1.1"
    instanceLabel: "opnsense-prod"
    apiKeySecretRef: {name: "opnsense-observability-opnsense-api", key: "api-key"}
    apiSecretSecretRef: {name: "opnsense-observability-opnsense-api", key: "api-secret"}

blackboxExporter:
  enabled: true
  wanGatewayAddress: "203.0.113.1"    # required whenever enabled is true
  probeSelectorLabels:
    release: kube-prometheus-stack     # match your cluster's Prometheus probeSelector

serviceMonitor:
  labels:
    release: kube-prometheus-stack     # match your cluster's Prometheus serviceMonitorSelector
