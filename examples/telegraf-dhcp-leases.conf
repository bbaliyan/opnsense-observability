# Publishes current dnsmasq DHCP leases as dhcp_lease_expiry{ip,hostname}.
# One series per lease; a lease that disappears from the file drops out of
# /metrics once the prometheus_client expiration_interval passes.
[[inputs.file]]
  files = ["/var/db/dnsmasq.leases"]
  name_override = "dhcp_lease"
  data_format = "grok"
  grok_patterns = ['^%{NUMBER:expiry:int} %{NOTSPACE:mac:drop} %{IPV4:ip:tag} %{NOTSPACE:hostname:tag} %{NOTSPACE:clientid:drop}$']
