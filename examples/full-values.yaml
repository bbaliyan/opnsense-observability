# Full install: everything in minimal-values.yaml, plus Akvorado NetFlow
# traffic analytics (Redpanda + ClickHouse + traffic dashboard) and EveBox
# IDS alert triage. Point OPNsense's NetFlow export at the akvorado-inlet
# Service and the IDS plugin's EVE syslog output at the evebox-syslog
# Service — both published as LoadBalancers by this file. See the README's
# OPNsense setup section.
opnsenseExporter:
  opnsense:
    protocol: https
    address: "192.168.1.1"
    instanceLabel: "opnsense-prod"
    apiKeySecretRef: {name: "opnsense-observability-opnsense-api", key: "api-key"}
    apiSecretSecretRef: {name: "opnsense-observability-opnsense-api", key: "api-secret"}

serviceMonitor:
  labels:
    release: kube-prometheus-stack

akvorado:
  enabled: true
  netflow:
    serviceType: LoadBalancer   # OPNsense on the LAN needs a routable target
  console:
    ingress:
      enabled: true
      className: nginx
      host: "netflow.home.example"

evebox:
  enabled: true
  syslog:
    service:
      type: LoadBalancer   # the firewall ships EVE JSON here over TCP syslog
  # The web UI runs without authentication, so it stays on a ClusterIP
  # Service and is reached through the Ingress below.
  ingress:
    enabled: true
    className: nginx
    host: "ids.home.example"
