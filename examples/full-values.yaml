# Full install: everything from minimal-values.yaml, plus Akvorado NetFlow
# traffic analytics (Redpanda + ClickHouse + traffic dashboard) and EveBox
# IDS alert triage. Point OPNsense's NetFlow export at the akvorado-inlet
# Service, and the IDS plugin's EVE syslog output at the evebox Service's
# syslog port, that this creates — see README prerequisites.
opnsenseExporter:
  opnsense:
    protocol: https
    address: "192.168.1.1"
    instanceLabel: "opnsense-prod"
    apiKeySecretRef: {name: "opnsense-observability-opnsense-api", key: "api-key"}
    apiSecretSecretRef: {name: "opnsense-observability-opnsense-api", key: "api-secret"}

blackboxExporter:
  enabled: true
  wanGatewayAddress: "203.0.113.1"
  probeSelectorLabels:
    release: kube-prometheus-stack

serviceMonitor:
  labels:
    release: kube-prometheus-stack

akvorado:
  enabled: true
  netflow:
    serviceType: LoadBalancer   # OPNsense on the LAN needs a routable target
  console:
    ingress:
      enabled: true
      className: nginx
      host: "netflow.home.example"

evebox:
  enabled: true
  service:
    type: LoadBalancer   # OPNsense needs a routable syslog target
  ingress:
    enabled: true
    className: nginx
    host: "ids.home.example"
