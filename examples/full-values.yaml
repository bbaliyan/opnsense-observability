# Full install: everything from minimal-values.yaml, plus Akvorado NetFlow
# traffic analytics (Redpanda + ClickHouse + traffic dashboard). Point
# OPNsense's NetFlow export at the akvorado-inlet Service this creates —
# see README prerequisites, step 5.
opnsenseExporter:
  opnsense:
    protocol: https
    address: "192.168.1.1"
    instanceLabel: "opnsense-prod"
    apiKeySecretRef: {name: "opnsense-observability-opnsense-api", key: "api-key"}
    apiSecretSecretRef: {name: "opnsense-observability-opnsense-api", key: "api-secret"}

blackboxExporter:
  wanGatewayAddress: "203.0.113.1"
  probeSelectorLabels:
    release: kube-prometheus-stack

serviceMonitor:
  labels:
    release: kube-prometheus-stack

akvorado:
  enabled: true
  netflow:
    serviceType: LoadBalancer   # OPNsense on the LAN needs a routable target
  console:
    ingress:
      enabled: true
      className: nginx
      host: "netflow.home.example"
