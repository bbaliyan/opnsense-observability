{{- if .Values.blackboxExporter.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: {{ include "opnsense-observability.fullname" . }}-wan-gateway
  labels:
    {{- include "opnsense-observability.labels" . | nindent 4 }}
    {{- with .Values.blackboxExporter.probeSelectorLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  jobName: opnsense-wan-gateway
  interval: {{ .Values.blackboxExporter.scrapeInterval }}
  module: icmp
  prober:
    url: {{ .Release.Name }}-blackbox-exporter.{{ .Release.Namespace }}.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      static:
        - {{ required "blackboxExporter.wanGatewayAddress is required when blackboxExporter.enabled is true" .Values.blackboxExporter.wanGatewayAddress | quote }}
{{- end }}
