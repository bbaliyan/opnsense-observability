{{- if and .Values.akvorado.enabled .Values.akvorado.deviceNames.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "opnsense-observability.fullname" . }}-device-names
  labels:
    {{- include "opnsense-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: device-names
spec:
  schedule: {{ .Values.akvorado.deviceNames.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            {{- include "opnsense-observability.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: device-names
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
          containers:
            - name: sync
              image: "{{ .Values.akvorado.deviceNames.image.repository }}:{{ .Values.akvorado.deviceNames.image.tag }}"
              command: ["/bin/sh", "/scripts/sync.sh"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {memory: 64Mi}
              volumeMounts:
                - name: script
                  mountPath: /scripts
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: {{ include "opnsense-observability.fullname" . }}-device-names-script
                defaultMode: 0755
            - name: tmp
              emptyDir: {}
{{- end }}
