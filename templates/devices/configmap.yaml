{{- if and .Values.akvorado.enabled .Values.akvorado.deviceNames.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opnsense-observability.fullname" . }}-device-names-script
  labels:
    {{- include "opnsense-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: device-names
data:
  sync.sh: |
    #!/bin/sh
    set -eu
    CH="http://{{ include "opnsense-observability.fullname" . }}-clickhouse:8123"
    PROM="{{ required "akvorado.deviceNames.prometheusUrl is required" .Values.akvorado.deviceNames.prometheusUrl }}"

    curl -sSf "$CH/" --data-binary "CREATE TABLE IF NOT EXISTS default.device_names (ip String, name String, updated DateTime DEFAULT now()) ENGINE = ReplacingMergeTree(updated) ORDER BY ip"

    # One series per active lease, published by Telegraf on the firewall from its dnsmasq lease file.
    # When a lease is rewritten (same IP, new hostname) the old series lingers briefly; topk keeps the
    # lease with the latest expiry per IP so one sync never inserts two rows for the same IP.
    curl -sSf "$PROM/api/v1/query" --data-urlencode 'query=topk by (ip) (1, max by (ip, hostname) (dhcp_lease_expiry))' -o /tmp/leases.json
    # An empty result means Telegraf stopped publishing leases; fail so the job shows red instead of silently going stale.
    grep -q '"status":"success"' /tmp/leases.json
    grep -q '"ip"' /tmp/leases.json

    # Leases without a hostname are stored with an empty name, so a reused IP never keeps the old name;
    # the dashboard falls back to the IP. dnsmasq writes * for "no hostname".
    curl -sSf "$CH/" \
      --url-query "query=INSERT INTO default.device_names (ip, name) SELECT JSONExtractString(r, 'metric', 'ip'), if(JSONExtractString(r, 'metric', 'hostname') = '*', '', JSONExtractString(r, 'metric', 'hostname')) FROM (SELECT arrayJoin(JSONExtractArrayRaw(doc, 'data', 'result')) AS r FROM input('doc String')) WHERE JSONExtractString(r, 'metric', 'ip') != '' FORMAT JSONAsString" \
      --data-binary @/tmp/leases.json
    echo "device names synced: $(wc -c < /tmp/leases.json) bytes of leases"
{{- end }}
