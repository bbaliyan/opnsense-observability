{{- if and .Values.opnsenseExporter.enabled .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "opnsense-observability.fullname" . }}-opnsense-exporter
  namespace: {{ .Values.serviceMonitor.namespace | default .Release.Namespace }}
  labels:
    {{- include "opnsense-observability.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # The Service always lives in the release namespace, regardless of where
  # this ServiceMonitor itself is placed (serviceMonitor.namespace above).
  # Without this, Prometheus Operator defaults to only looking in the
  # ServiceMonitor's own namespace and silently never finds the Service.
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace | quote }}
  selector:
    matchLabels:
      {{- include "opnsense-observability.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: opnsense-exporter
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
