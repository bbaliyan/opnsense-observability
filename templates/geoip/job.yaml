{{- if and .Values.akvorado.enabled .Values.akvorado.geoip.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  # Job pod templates are immutable, so a plain fixed name would make any
  # future upgrade that touches this pod spec fail outright. Suffixing with
  # a hash of the chart version (not .Release.Revision, which is always "1"
  # under `helm template`-based GitOps tools like ArgoCD) creates a fresh
  # Job only when this template could actually have changed.
  name: {{ include "opnsense-observability.fullname" . }}-geoip-init-{{ .Chart.Version | sha256sum | trunc 8 }}
  labels:
    {{- include "opnsense-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: geoip
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "opnsense-observability.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: geoip
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "opnsense-observability.selectorLabels" . | nindent 18 }}
                  app.kubernetes.io/component: akvorado-outlet
              topologyKey: kubernetes.io/hostname
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        fsGroup: 101
      containers:
        - name: geoip-download
          image: curlimages/curl:8.11.1
          command: ["/bin/sh", "/scripts/download.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: geoip
              mountPath: /geoip
      volumes:
        - name: script
          configMap:
            name: {{ include "opnsense-observability.fullname" . }}-geoip-script
            defaultMode: 0755
        - name: geoip
          persistentVolumeClaim:
            claimName: {{ include "opnsense-observability.fullname" . }}-geoip
{{- end }}
