{{- if and .Values.dashboards.enabled .Values.akvorado.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opnsense-observability.fullname" . }}-dashboard-traffic
  labels:
    {{- include "opnsense-observability.labels" . | nindent 4 }}
    grafana_dashboard: "1"
  annotations:
    grafana_folder: {{ .Values.dashboards.folder }}
data:
  traffic.json: |
{{ .Files.Get "files/dashboards/traffic.json" | indent 4 }}
{{- end }}
