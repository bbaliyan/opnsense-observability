{{- if .Values.dashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opnsense-observability.fullname" . }}-dashboard-connectivity
  labels:
    {{- include "opnsense-observability.labels" . | nindent 4 }}
    grafana_dashboard: "1"
  annotations:
    grafana_folder: {{ .Values.dashboards.folder }}
data:
  connectivity.json: |
{{ .Files.Get "files/dashboards/connectivity.json" | indent 4 }}
{{- end }}
