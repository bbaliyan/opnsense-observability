{{- if .Values.evebox.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opnsense-observability.fullname" . }}-evebox
  labels:
    {{- include "opnsense-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: evebox
spec:
  type: {{ .Values.evebox.service.type }}
  selector:
    {{- include "opnsense-observability.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: evebox
  ports:
    - name: http
      port: {{ .Values.evebox.service.port }}
      targetPort: http
{{- end }}
