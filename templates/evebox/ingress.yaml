{{- if and .Values.evebox.enabled .Values.evebox.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "opnsense-observability.fullname" . }}-evebox
  labels:
    {{- include "opnsense-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: evebox
  {{- with .Values.evebox.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.evebox.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ required "evebox.ingress.host is required when evebox.ingress.enabled" .Values.evebox.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "opnsense-observability.fullname" . }}-evebox
                port:
                  name: http
  {{- with .Values.evebox.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
