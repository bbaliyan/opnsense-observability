{{- if .Values.evebox.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opnsense-observability.fullname" . }}-evebox-syslog
  labels:
    {{- include "opnsense-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: evebox
data:
  vector.yaml: |
    data_dir: /vector-data
    sources:
      eve:
        type: syslog
        address: 0.0.0.0:{{ .Values.evebox.syslog.service.port }}
        mode: tcp
        max_length: {{ int .Values.evebox.syslog.maxMessageBytes }}
    transforms:
      suricata_only:
        type: filter
        inputs: [eve]
        condition:
          type: vrl
          source: '.appname == "suricata"'
    sinks:
      eve_file:
        type: file
        inputs: [suricata_only]
        path: /var/lib/evebox/spool/eve.json
        encoding:
          codec: text
{{- end }}
