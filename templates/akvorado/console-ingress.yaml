{{- if and .Values.akvorado.enabled .Values.akvorado.console.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "opnsense-observability.fullname" . }}-akvorado-console
  labels:
    {{- include "opnsense-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: akvorado-console
  {{- with .Values.akvorado.console.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.akvorado.console.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ required "akvorado.console.ingress.host is required when akvorado.console.ingress.enabled" .Values.akvorado.console.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "opnsense-observability.fullname" . }}-akvorado-console
                port:
                  name: http
  {{- with .Values.akvorado.console.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
