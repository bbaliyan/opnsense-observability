{{- if .Values.akvorado.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opnsense-observability.fullname" . }}-akvorado-orchestrator
  labels:
    {{- include "opnsense-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: akvorado-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "opnsense-observability.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: akvorado-orchestrator
  template:
    metadata:
      labels:
        {{- include "opnsense-observability.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: akvorado-orchestrator
    spec:
      containers:
        - name: orchestrator
          image: "{{ .Values.akvorado.image.repository }}:{{ .Values.akvorado.image.tag }}"
          imagePullPolicy: {{ .Values.akvorado.image.pullPolicy }}
          command: ["akvorado", "orchestrator", "/etc/akvorado/akvorado.yaml"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/akvorado
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/v0/orchestrator/metrics
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v0/orchestrator/metrics
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.akvorado.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "opnsense-observability.fullname" . }}-akvorado-config
{{- end }}
