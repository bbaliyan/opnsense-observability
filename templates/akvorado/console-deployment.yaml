{{- if .Values.akvorado.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opnsense-observability.fullname" . }}-akvorado-console
  labels:
    {{- include "opnsense-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: akvorado-console
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "opnsense-observability.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: akvorado-console
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/akvorado/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "opnsense-observability.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: akvorado-console
    spec:
      containers:
        - name: console
          image: "{{ .Values.akvorado.image.repository }}:{{ .Values.akvorado.image.tag }}"
          imagePullPolicy: {{ .Values.akvorado.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - akvorado
            - console
            - http://{{ include "opnsense-observability.fullname" . }}-akvorado-orchestrator:8080
          env:
            - name: AKVORADO_CFG_CONSOLE_DATABASE_DSN
              value: /run/akvorado/console.sqlite
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: state
              mountPath: /run/akvorado
          readinessProbe:
            httpGet:
              path: /api/v0/console/metrics
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v0/console/metrics
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.akvorado.resources | nindent 12 }}
      volumes:
        # Console state is disposable in this chart's scope - saved filters
        # don't need to survive a pod restart.
        - name: state
          emptyDir: {}
{{- end }}
