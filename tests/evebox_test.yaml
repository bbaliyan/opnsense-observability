suite: evebox
templates:
  - evebox/deployment.yaml
  - evebox/service.yaml
  - evebox/syslog-service.yaml
  - evebox/pvc.yaml
  - evebox/ingress.yaml
  - evebox/vector-configmap.yaml
set:
  evebox.enabled: true
tests:
  - it: renders nothing when evebox is disabled
    template: evebox/deployment.yaml
    set:
      evebox.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: renders no Service when evebox is disabled
    template: evebox/service.yaml
    set:
      evebox.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: renders no PVC when evebox is disabled
    template: evebox/pvc.yaml
    set:
      evebox.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: renders a Deployment with the pinned EveBox image and SQLite args
    template: evebox/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].image
          value: jasonish/evebox:0.28.0
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["--sqlite", "--no-auth", "--no-tls", "--host", "0.0.0.0", "--port", "5636", "-D", "/var/lib/evebox", "--input", "/var/lib/evebox/spool/eve.json"]
      - notExists:
          path: spec.template.spec.containers[0].command
  - it: uses Recreate strategy to avoid deadlocking on the RWO data PVC
    template: evebox/deployment.yaml
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
  - it: does not set pod-level runAsNonRoot, since the image only runs as root
    template: evebox/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.securityContext.runAsNonRoot
  - it: mounts the data PVC at /var/lib/evebox
    template: evebox/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /var/lib/evebox
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: RELEASE-NAME-opnsense-observability-evebox
  - it: renders a PVC with the configured size
    template: evebox/pvc.yaml
    set:
      evebox.persistence.size: 10Gi
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: spec.resources.requests.storage
          value: 10Gi
  - it: exposes the configured port as a ClusterIP Service by default
    template: evebox/service.yaml
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 5636
      - equal:
          path: spec.ports[0].targetPort
          value: http
  - it: renders nothing for the Ingress when ingress is disabled
    template: evebox/ingress.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: renders an Ingress with the configured host and class when enabled
    template: evebox/ingress.yaml
    set:
      evebox.ingress.enabled: true
      evebox.ingress.host: evebox.home.example
      evebox.ingress.className: nginx
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: spec.ingressClassName
          value: nginx
      - equal:
          path: spec.rules[0].host
          value: evebox.home.example
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: RELEASE-NAME-opnsense-observability-evebox
  - it: runs a vector sidecar that terminates syslog
    template: evebox/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: syslog
      - matchRegex:
          path: spec.template.spec.containers[1].image
          pattern: "^timberio/vector:"
      - equal:
          path: spec.template.spec.containers[1].args
          value: ["--config", "/etc/vector/vector.yaml"]
      - equal:
          path: spec.template.spec.containers[1].ports[0].name
          value: syslog
      - equal:
          path: spec.template.spec.containers[1].ports[0].containerPort
          value: 5140
      - equal:
          path: spec.template.spec.containers[1].volumeMounts
          value:
            - name: data
              mountPath: /var/lib/evebox
            - name: vector-config
              mountPath: /etc/vector
              readOnly: true
            - name: vector-data
              mountPath: /vector-data
  - it: mounts the vector sidecar config from the ConfigMap by name
    template: evebox/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.volumes[2].name
          value: vector-config
      - equal:
          path: spec.template.spec.volumes[2].configMap.name
          value: RELEASE-NAME-opnsense-observability-evebox-syslog
  - it: names the vector ConfigMap what the deployment mounts
    template: evebox/vector-configmap.yaml
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opnsense-observability-evebox-syslog
  - it: points the evebox server at the spool file vector writes on the PVC
    template: evebox/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --input
      - contains:
          path: spec.template.spec.containers[0].args
          content: /var/lib/evebox/spool/eve.json
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --end
  - it: spools onto the data PVC shared by both containers, not an emptyDir
    template: evebox/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: data
              mountPath: /var/lib/evebox
      - equal:
          path: spec.template.spec.volumes[0].name
          value: data
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: RELEASE-NAME-opnsense-observability-evebox
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 3
  - it: keeps the unauthenticated UI Service free of the syslog port
    template: evebox/service.yaml
    asserts:
      - lengthEqual:
          path: spec.ports
          count: 1
      - equal:
          path: spec.ports[0].name
          value: http
  - it: carries syslog on a separate Service that can be published alone
    template: evebox/syslog-service.yaml
    set:
      evebox.syslog.service.type: LoadBalancer
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opnsense-observability-evebox-syslog
      - equal:
          path: spec.type
          value: LoadBalancer
      - lengthEqual:
          path: spec.ports
          count: 1
      - equal:
          path: spec.ports[0].name
          value: syslog
      - equal:
          path: spec.ports[0].port
          value: 5140
      - equal:
          path: spec.ports[0].targetPort
          value: syslog
      - equal:
          path: spec.ports[0].protocol
          value: TCP
  - it: defaults the syslog Service to ClusterIP
    template: evebox/syslog-service.yaml
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
  - it: renders no syslog Service when evebox is disabled
    template: evebox/syslog-service.yaml
    set:
      evebox.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: renders the syslog listener config vector consumes
    template: evebox/vector-configmap.yaml
    set:
      evebox.syslog.service.port: 5999
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["vector.yaml"]
          pattern: "address: 0\\.0\\.0\\.0:5999"
      - matchRegex:
          path: data["vector.yaml"]
          pattern: "(?m)^ *type: syslog$"
      - matchRegex:
          path: data["vector.yaml"]
          pattern: "(?m)^ *mode: tcp$"
      - matchRegex:
          path: data["vector.yaml"]
          pattern: "(?m)^ *codec: text$"
      - matchRegex:
          path: data["vector.yaml"]
          pattern: "(?m)^ *max_length: 1048576$"
      - matchRegex:
          path: data["vector.yaml"]
          pattern: "path: /var/lib/evebox/spool/eve\\.json"
  - it: keeps everything but suricata out of the EVE spool
    template: evebox/vector-configmap.yaml
    asserts:
      - matchRegex:
          path: data["vector.yaml"]
          pattern: "(?m)^ *source: '\\.appname == \"suricata\"'$"
      - matchRegex:
          path: data["vector.yaml"]
          pattern: "(?m)^ *inputs: \\[suricata_only\\]$"
      - matchRegex:
          path: data["vector.yaml"]
          pattern: "(?m)^ *inputs: \\[eve\\]$"
  - it: renders no vector config when evebox is disabled
    template: evebox/vector-configmap.yaml
    set:
      evebox.enabled: false
    asserts:
      - hasDocuments:
          count: 0
