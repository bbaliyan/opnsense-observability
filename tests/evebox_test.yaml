suite: evebox
templates:
  - evebox/deployment.yaml
  - evebox/service.yaml
  - evebox/pvc.yaml
  - evebox/ingress.yaml
  - evebox/vector-configmap.yaml
set:
  evebox.enabled: true
tests:
  - it: renders nothing when evebox is disabled
    template: evebox/deployment.yaml
    set:
      evebox.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: renders no Service when evebox is disabled
    template: evebox/service.yaml
    set:
      evebox.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: renders no PVC when evebox is disabled
    template: evebox/pvc.yaml
    set:
      evebox.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: renders a Deployment with the pinned EveBox image and SQLite args
    template: evebox/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].image
          value: jasonish/evebox:0.28.0
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["--sqlite", "--no-auth", "--no-tls", "--host", "0.0.0.0", "--port", "5636", "-D", "/var/lib/evebox", "--input", "/var/log/suricata/eve.json", "--end"]
      - notExists:
          path: spec.template.spec.containers[0].command
  - it: uses Recreate strategy to avoid deadlocking on the RWO data PVC
    template: evebox/deployment.yaml
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
  - it: does not set pod-level runAsNonRoot, since the image only runs as root
    template: evebox/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.securityContext.runAsNonRoot
  - it: mounts the data PVC at /var/lib/evebox
    template: evebox/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /var/lib/evebox
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: RELEASE-NAME-opnsense-observability-evebox
  - it: renders a PVC with the configured size
    template: evebox/pvc.yaml
    set:
      evebox.persistence.size: 10Gi
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: spec.resources.requests.storage
          value: 10Gi
  - it: exposes the configured port as a ClusterIP Service by default
    template: evebox/service.yaml
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 5636
      - equal:
          path: spec.ports[0].targetPort
          value: http
  - it: renders nothing for the Ingress when ingress is disabled
    template: evebox/ingress.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: renders an Ingress with the configured host and class when enabled
    template: evebox/ingress.yaml
    set:
      evebox.ingress.enabled: true
      evebox.ingress.host: evebox.home.example
      evebox.ingress.className: nginx
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: spec.ingressClassName
          value: nginx
      - equal:
          path: spec.rules[0].host
          value: evebox.home.example
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: RELEASE-NAME-opnsense-observability-evebox
  - it: runs a vector sidecar that terminates syslog
    template: evebox/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: syslog
      - matchRegex:
          path: spec.template.spec.containers[1].image
          pattern: "^timberio/vector:"
  - it: points the evebox server at the file vector writes
    template: evebox/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --input
      - contains:
          path: spec.template.spec.containers[0].args
          content: /var/log/suricata/eve.json
      - contains:
          path: spec.template.spec.containers[0].args
          content: --end
  - it: shares the eve volume between both containers
    template: evebox/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].name
          value: eve
      - equal:
          path: spec.template.spec.containers[1].volumeMounts[0].name
          value: eve
      - equal:
          path: spec.template.spec.containers[1].volumeMounts[0].mountPath
          value: /var/log/suricata
  - it: exposes the syslog port on the service
    template: evebox/service.yaml
    asserts:
      - equal:
          path: spec.ports[1].name
          value: syslog
      - equal:
          path: spec.ports[1].port
          value: 5140
      - equal:
          path: spec.ports[1].protocol
          value: TCP
  - it: renders the syslog listener config vector consumes
    template: evebox/vector-configmap.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["vector.yaml"]
          pattern: "address: 0\\.0\\.0\\.0:5140"
      - matchRegex:
          path: data["vector.yaml"]
          pattern: "(?m)^ *max_length: 1048576$"
      - matchRegex:
          path: data["vector.yaml"]
          pattern: "path: /var/log/suricata/eve\\.json"
  - it: renders no vector config when evebox is disabled
    template: evebox/vector-configmap.yaml
    set:
      evebox.enabled: false
    asserts:
      - hasDocuments:
          count: 0
