suite: dashboard ConfigMaps
templates:
  - dashboards/internet-firewall-dashboard.yaml
tests:
  - it: renders the Internet & Firewall dashboard ConfigMap with the sidecar label
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.labels.grafana_dashboard
          value: "1"
      - exists:
          path: data["internet-firewall.json"]
  - it: resolves every datasource through the DS_PROMETHEUS variable
    asserts:
      - notMatchRegex:
          path: data["internet-firewall.json"]
          pattern: '"type": "prometheus",\s*"uid": "[^$]'
      - notMatchRegex:
          path: data["internet-firewall.json"]
          pattern: __inputs|__requires
  - it: queries every dpinger metric the connectivity panels need
    asserts:
      - matchRegex:
          path: data["internet-firewall.json"]
          pattern: opnsense_gateways_status\{opnsense_instance=\\"\$opnsense_instance\\",name=~\\"\$gateway\\"\}
      - matchRegex:
          path: data["internet-firewall.json"]
          pattern: opnsense_gateways_rtt_milliseconds\{opnsense_instance=\\"\$opnsense_instance\\",name=~\\"\$gateway\\"\}
      - matchRegex:
          path: data["internet-firewall.json"]
          pattern: opnsense_gateways_rttd_milliseconds\{opnsense_instance=\\"\$opnsense_instance\\",name=~\\"\$gateway\\"\}
      - matchRegex:
          path: data["internet-firewall.json"]
          pattern: opnsense_gateways_loss_percentage\{opnsense_instance=\\"\$opnsense_instance\\",name=~\\"\$gateway\\"\}
  - it: maps all three gateway states so an unknown gateway never reads as healthy
    asserts:
      - matchRegex:
          path: data["internet-firewall.json"]
          pattern: '"text": "Unknown"'
  - it: drives node_exporter panels and exporter panels from separate instance variables
    asserts:
      - matchRegex:
          path: data["internet-firewall.json"]
          pattern: '"query": "label_values\(opnsense_up, opnsense_instance\)"'
      - matchRegex:
          path: data["internet-firewall.json"]
          pattern: node_time_seconds\{instance=\\"\$node_instance\\"\}
      - matchRegex:
          path: data["internet-firewall.json"]
          pattern: opnsense_services_status\{opnsense_instance=\\"\$opnsense_instance\\"\}
      - matchRegex:
          path: data["internet-firewall.json"]
          pattern: 'interface=~\\"\$fw_interface\\"'
      - notMatchRegex:
          path: data["internet-firewall.json"]
          pattern: 'node_[a-z_]*\{instance=\\"\$opnsense_instance'
  - it: resolves WAN and LAN devices from the exporter's interface names
    asserts:
      - matchRegex:
          path: data["internet-firewall.json"]
          pattern: 'interface=\\"\$wan\\"\}, device\)'
      - matchRegex:
          path: data["internet-firewall.json"]
          pattern: node_network_receive_bytes_total\{instance=\\"\$node_instance\\",device=\\"\$wan_device\\"\}
      - notMatchRegex:
          path: data["internet-firewall.json"]
          pattern: '\$job|igc[0-9]'
  - it: carries the merged identity and the firewall interface picker
    asserts:
      - matchRegex:
          path: data["internet-firewall.json"]
          pattern: '"uid": "internet-firewall"'
      - matchRegex:
          path: data["internet-firewall.json"]
          pattern: '"name": "fw_interface"'
      - notMatchRegex:
          path: data["internet-firewall.json"]
          pattern: '\$(fs_device|interface)\b'
  - it: leaves the NetFlow section out when NetFlow is off
    asserts:
      - notMatchRegex:
          path: data["internet-firewall.json"]
          pattern: 'DS_CLICKHOUSE|Traffic \(NetFlow\)'
  - it: puts the NetFlow section in the dashboard when NetFlow is on, using Akvorado's real columns
    set:
      akvorado.enabled: true
    asserts:
      - matchRegex:
          path: data["internet-firewall.json"]
          pattern: 'Traffic \(NetFlow\)'
      - matchRegex:
          path: data["internet-firewall.json"]
          pattern: '"name": "DS_CLICKHOUSE"'
      - matchRegex:
          path: data["internet-firewall.json"]
          pattern: 'sum\(Bytes \* SamplingRate\)'
      - matchRegex:
          path: data["internet-firewall.json"]
          pattern: 'DstCountry, SrcCountry\) AS lookup'
      - matchRegex:
          path: data["internet-firewall.json"]
          pattern: '"gazetteer": "public/gazetteer/countries.json"'
      - notMatchRegex:
          path: data["internet-firewall.json"]
          pattern: ProtoName
  - it: shows internet usage per device and counts each byte once
    set:
      akvorado.enabled: true
    asserts:
      - matchRegex:
          path: data["internet-firewall.json"]
          pattern: 'Internet usage by device'
      - matchRegex:
          path: data["internet-firewall.json"]
          pattern: 'Internet bandwidth by device'
      - matchRegex:
          path: data["internet-firewall.json"]
          pattern: 'default.device_names'
      - matchRegex:
          path: data["internet-firewall.json"]
          pattern: 'is_local\(SrcAddr\) != is_local\(DstAddr\)'
      - matchRegex:
          path: data["internet-firewall.json"]
          pattern: '"name": "device"'
  - it: moves the Firewall row down by the height of the NetFlow section
    set:
      akvorado.enabled: true
    asserts:
      - matchRegex:
          path: data["internet-firewall.json"]
          pattern: '"y": 61\s*\},\s*"id": [0-9]+,\s*"panels": \[\],\s*"title": "Firewall"'
  - it: renders nothing when dashboards are disabled
    set:
      dashboards.enabled: false
    asserts:
      - hasDocuments:
          count: 0
