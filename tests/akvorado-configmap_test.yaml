suite: akvorado shared config
templates:
  - akvorado/configmap.yaml
set:
  akvorado.enabled: true
tests:
  - it: renders nothing when akvorado is disabled
    set:
      akvorado.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: defaults the Kafka broker to the bundled Redpanda's internal listener
    release:
      name: my-release
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["akvorado.yaml"]
          pattern: "my-release:9093"
  - it: uses an explicit broker list when provided
    set:
      akvorado.kafka.brokers: ["external-kafka:9092"]
    asserts:
      - matchRegex:
          path: data["akvorado.yaml"]
          pattern: "external-kafka:9092"
      - notMatchRegex:
          path: data["akvorado.yaml"]
          pattern: "redpanda:9093"
  - it: points the GeoIP databases at the DB-IP Lite mmdb paths
    asserts:
      - matchRegex:
          path: data["outlet.yaml"]
          pattern: "dbip-asn-lite.mmdb"
      - matchRegex:
          path: data["outlet.yaml"]
          pattern: "dbip-country-lite.mmdb"
  - it: merges the outlet extra configuration, e.g. a static metadata provider
    set:
      akvorado.outlet.extraConfig:
        metadata:
          providers:
            - type: static
              exporters:
                192.0.2.1:
                  name: firewall
    asserts:
      - matchRegex:
          path: data["outlet.yaml"]
          pattern: "type: static"
      - matchRegex:
          path: data["outlet.yaml"]
          pattern: "name: firewall"
  - it: adds nothing to the outlet configuration by default
    asserts:
      - notMatchRegex:
          path: data["outlet.yaml"]
          pattern: "metadata"
  - it: merges the outlet extra configuration over the geoip block without duplicating the key
    set:
      akvorado.outlet.extraConfig:
        geoip:
          optional: false
    asserts:
      - notMatchRegex:
          path: data["outlet.yaml"]
          pattern: "geoip:[\s\S]*geoip:"
  - it: stamps flows with the time they started by default
    asserts:
      - matchRegex:
          path: data["inlet.yaml"]
          pattern: "timestamp-source: netflow-first-switched"
  - it: lets the timestamp source be changed
    set:
      akvorado.netflow.timestampSource: udp
    asserts:
      - matchRegex:
          path: data["inlet.yaml"]
          pattern: "timestamp-source: udp"
