suite: device names (DHCP leases into ClickHouse)
templates:
  - devices/configmap.yaml
  - devices/cronjob.yaml
set:
  akvorado.enabled: true
  akvorado.deviceNames.enabled: true
  akvorado.deviceNames.prometheusUrl: http://prom.example:9090
tests:
  - it: renders nothing when NetFlow is off
    set:
      akvorado.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: renders nothing unless device names are switched on
    set:
      akvorado.deviceNames.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: runs on the configured schedule and never overlaps itself
    template: devices/cronjob.yaml
    set:
      akvorado.deviceNames.schedule: "*/10 * * * *"
    asserts:
      - equal:
          path: spec.schedule
          value: "*/10 * * * *"
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid
  - it: holds no firewall credentials and runs with a read-only filesystem
    template: devices/cronjob.yaml
    asserts:
      - notExists:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
  - it: reads the lease series from Prometheus and writes them to ClickHouse
    template: devices/configmap.yaml
    release:
      name: obs
    asserts:
      - matchRegex:
          path: data["sync.sh"]
          pattern: 'PROM="http://prom.example:9090"'
      - matchRegex:
          path: data["sync.sh"]
          pattern: "dhcp_lease_expiry"
      - matchRegex:
          path: data["sync.sh"]
          pattern: "topk by \\(ip\\) \\(1,"
      - matchRegex:
          path: data["sync.sh"]
          pattern: "http://obs-opnsense-observability-clickhouse:8123"
      - notMatchRegex:
          path: data["sync.sh"]
          pattern: "api/dnsmasq|OPNSENSE_API"
  - it: fails the render when no Prometheus URL is given
    template: devices/configmap.yaml
    set:
      akvorado.deviceNames.prometheusUrl: ""
    asserts:
      - failedTemplate:
          errorMessage: akvorado.deviceNames.prometheusUrl is required
