suite: blackbox Probe for the OPNsense WAN gateway
templates:
  - blackbox/probe.yaml
set:
  blackboxExporter.enabled: true
  blackboxExporter.wanGatewayAddress: "10.20.30.1"
tests:
  - it: renders a Probe targeting only the configured WAN gateway address
    asserts:
      - isKind:
          of: Probe
      - equal:
          path: metadata.name
          value: RELEASE-NAME-opnsense-observability-wan-gateway
      - equal:
          path: spec.jobName
          value: opnsense-wan-gateway
      - equal:
          path: spec.module
          value: icmp
      - equal:
          path: spec.interval
          value: 10s
      - equal:
          path: spec.targets.staticConfig.static
          value:
            - "10.20.30.1"
      - equal:
          path: spec.prober.url
          value: RELEASE-NAME-blackbox-exporter.NAMESPACE.svc.cluster.local:9115
  - it: emits no vantage label on the target
    asserts:
      - notExists:
          path: spec.targets.staticConfig.labels
  - it: fails the render when no WAN gateway address is set
    set:
      blackboxExporter.wanGatewayAddress: ""
    asserts:
      - failedTemplate:
          errorMessage: blackboxExporter.wanGatewayAddress is required when blackboxExporter.enabled is true
  - it: renders nothing when blackboxExporter is disabled
    set:
      blackboxExporter.enabled: false
    asserts:
      - hasDocuments:
          count: 0
