suite: core alert rules
templates:
  - alerts/prometheusrule.yaml
tests:
  - it: renders a PrometheusRule with all four core alerts
    asserts:
      - isKind:
          of: PrometheusRule
      - equal:
          path: spec.groups[0].rules[0].alert
          value: OPNsenseFirmwareUpdateAvailable
      - equal:
          path: spec.groups[0].rules[1].alert
          value: OPNsenseGatewayDown
      - equal:
          path: spec.groups[0].rules[2].alert
          value: OPNsenseHighPacketLoss
      - equal:
          path: spec.groups[0].rules[3].alert
          value: OPNsenseHighLatency
      - equal:
          path: spec.groups[0].rules[1].labels.severity
          value: critical
      - lengthEqual:
          path: spec.groups[0].rules
          count: 4
  - it: alerts on every gateway, including the monitor-only internet ones
    asserts:
      - equal:
          path: spec.groups[0].rules[1].expr
          value: opnsense_gateways_status != 1
  - it: omits the firmware alert when disabled
    set:
      alerts.firmwareUpdateAvailable.enabled: false
    asserts:
      - notEqual:
          path: spec.groups[0].rules[0].alert
          value: OPNsenseFirmwareUpdateAvailable
      - lengthEqual:
          path: spec.groups[0].rules
          count: 3
  - it: renders the WAN gateway probe alert only when blackbox-exporter is enabled
    set:
      blackboxExporter.enabled: true
      blackboxExporter.wanGatewayAddress: "10.20.30.1"
    asserts:
      - equal:
          path: spec.groups[0].rules[4].alert
          value: OPNsenseWANGatewayProbeFailed
      - equal:
          path: spec.groups[0].rules[4].expr
          value: probe_success{job="opnsense-wan-gateway"} == 0
  - it: omits the WAN gateway probe alert when blackbox-exporter is off
    asserts:
      - lengthEqual:
          path: spec.groups[0].rules
          count: 4
  - it: renders nothing when alerts are disabled globally
    set:
      alerts.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: renders AkvoradoPipelineLag when akvorado and the alert are both enabled
    set:
      akvorado.enabled: true
      alerts.akvoradoPipelineLag.enabled: true
    asserts:
      - equal:
          path: spec.groups[0].rules[4].alert
          value: AkvoradoPipelineLag
  - it: omits AkvoradoPipelineLag when disabled
    set:
      alerts.akvoradoPipelineLag.enabled: false
    asserts:
      - lengthEqual:
          path: spec.groups[0].rules
          count: 4
  - it: omits AkvoradoPipelineLag when akvorado is disabled even if the alert itself is enabled
    set:
      akvorado.enabled: false
      alerts.akvoradoPipelineLag.enabled: true
    asserts:
      - lengthEqual:
          path: spec.groups[0].rules
          count: 4
