suite: geoip download (pvc, job, cronjob)
templates:
  - geoip/pvc.yaml
  - geoip/configmap.yaml
  - geoip/job.yaml
  - geoip/cronjob.yaml
set:
  akvorado.enabled: true
  akvorado.geoip.enabled: true
tests:
  - it: renders nothing when akvorado is disabled
    template: geoip/pvc.yaml
    set:
      akvorado.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: renders nothing when geoip.enabled is false
    template: geoip/pvc.yaml
    set:
      akvorado.geoip.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: sizes the PVC from values
    template: geoip/pvc.yaml
    set:
      akvorado.geoip.persistence.size: 256Mi
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 256Mi
  - it: the download script targets both dbip-lite mmdb files by exact filename
    template: geoip/configmap.yaml
    asserts:
      - matchRegex:
          path: data["download.sh"]
          pattern: "dbip-country-lite.mmdb"
      - matchRegex:
          path: data["download.sh"]
          pattern: "dbip-asn-lite.mmdb"
  - it: the init Job runs as a normal resource, not a Helm hook
    template: geoip/job.yaml
    asserts:
      - notExists:
          path: metadata.annotations
  - it: the init Job requires scheduling onto the outlet's node
    template: geoip/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.affinity.podAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].labelSelector.matchLabels["app.kubernetes.io/component"]
          value: akvorado-outlet
      - equal:
          path: spec.template.spec.affinity.podAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].topologyKey
          value: kubernetes.io/hostname
  - it: the CronJob uses the configured schedule
    template: geoip/cronjob.yaml
    set:
      akvorado.geoip.updateSchedule: "0 6 1 * *"
    asserts:
      - equal:
          path: spec.schedule
          value: "0 6 1 * *"
  - it: the CronJob requires scheduling onto the outlet's node
    template: geoip/cronjob.yaml
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.affinity.podAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].labelSelector.matchLabels["app.kubernetes.io/component"]
          value: akvorado-outlet
  - it: fails to render when an unsupported geoip source is set
    template: geoip/configmap.yaml
    set:
      akvorado.geoip.source: maxmind
    asserts:
      - failedTemplate:
          errorMessage: "only dbip-lite is currently supported for akvorado.geoip.source"
  - it: fails to render when an unsupported geoip source is set even if geoip.enabled is false
    template: geoip/configmap.yaml
    set:
      akvorado.geoip.source: maxmind
      akvorado.geoip.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "only dbip-lite is currently supported for akvorado.geoip.source"
  - it: renders normally with the default dbip-lite source
    template: geoip/configmap.yaml
    asserts:
      - isKind:
          of: ConfigMap
