opnsenseExporter:
  opnsense:
    protocol: http
    address: "127.0.0.1"
    instanceLabel: "ci-dummy"
    insecureSkipVerify: true
    apiKeySecretRef: {name: "ci-dummy-secret", key: "api-key"}
    apiSecretSecretRef: {name: "ci-dummy-secret", key: "api-secret"}

blackboxExporter:
  enabled: true
  wanGatewayAddress: "10.0.0.1"

akvorado:
  enabled: true
  geoip:
    enabled: false   # no live internet dependency in CI; DB-IP paths are exercised by helm-unittest instead
  clickhouse:
    persistence:
      size: 2Gi
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {memory: 1500Mi}

redpanda:
  statefulset:
    replicas: 1
  resources:
    cpu:
      cores: 500m
    memory:
      container:
        max: 2Gi

evebox:
  enabled: true
  persistence:
    size: 1Gi
  syslog:
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {memory: 128Mi}
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}

extraObjects: []
